name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    # Trusted publishing: npm verifies this workflow's OIDC identity, so no
    # token is stored in repository secrets. Configure the trusted publisher
    # once at npmjs.com -> package settings before the first automated run.
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # OIDC publishing needs npm 11.5.1 or newer.
      - name: Use a recent npm
        run: npm install -g npm@latest

      - name: Test before publishing
        run: |
          node --test
          npx rtl-lint src bin

      - name: Publish
        run: npm publish
