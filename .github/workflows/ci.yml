name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18.18", "20", "22", "24"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: npm ci

      # Includes the conformance suite, which drives this server with the
      # official MCP SDK client over a real stdio pipe.
      - name: Run tests
        run: npm test

      - name: Check for RTL issues in our own source
        run: npx rtl-lint src bin
